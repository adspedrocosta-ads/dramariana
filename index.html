<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Ads — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --surface2: #1e2230;
    --border: rgba(255,255,255,.07);
    --text: #f0f2f7;
    --muted: #8b8fa8;
    --blue: #4a90e2;
    --teal: #1fc08a;
    --orange: #f5a623;
    --red: #e05252;
    --green: #4caf7d;
    --purple: #9b7fe8;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 32px; height: 32px; background: #1877f2; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { width: 18px; height: 18px; fill: white; }
  .logo-text { font-size: 15px; font-weight: 600; }
  .logo-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .date-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 12px; color: var(--muted); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .refresh-btn {
    background: var(--blue);
    border: none;
    color: white;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 500;
    transition: opacity .2s;
  }
  .refresh-btn:hover { opacity: .85; }

  main { max-width: 1400px; margin: 0 auto; padding: 28px 32px; }

  .campaign-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .campaign-name { font-size: 16px; font-weight: 600; }
  .campaign-meta { display: flex; gap: 16px; flex-wrap: wrap; }
  .campaign-tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    color: var(--muted);
  }
  .campaign-tag span { color: var(--text); font-weight: 500; margin-left: 4px; }

  .section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .kpi-card.blue::before { background: var(--blue); }
  .kpi-card.teal::before { background: var(--teal); }
  .kpi-card.orange::before { background: var(--orange); }
  .kpi-card.purple::before { background: var(--purple); }
  .kpi-card.green::before { background: var(--green); }
  .kpi-card.red::before { background: var(--red); }
  .kpi-label { font-size: 11px; color: var(--muted); margin-bottom: 10px; font-weight: 500; }
  .kpi-value { font-size: 26px; font-weight: 700; line-height: 1; margin-bottom: 8px; }
  .kpi-delta { font-size: 11px; }
  .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .pos { color: var(--teal); }
  .neg { color: var(--red); }
  .neu { color: var(--muted); }

  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
  @media(max-width:760px){ .charts-row { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .card-title { font-size: 13px; font-weight: 600; margin-bottom: 18px; color: var(--text); }
  .card-sub { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 400; }

  .funnel-stage {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .funnel-label-col { min-width: 170px; font-size: 12px; color: var(--muted); }
  .funnel-bar-col { flex: 1; background: var(--surface2); border-radius: 4px; height: 32px; overflow: hidden; position: relative; }
  .funnel-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding: 0 10px; font-size: 11px; font-weight: 600; color: white; white-space: nowrap; transition: width .8s cubic-bezier(.4,0,.2,1); }
  .funnel-values { min-width: 130px; text-align: right; }
  .funnel-num { font-size: 13px; font-weight: 600; }
  .funnel-cvr { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .funnel-arrow { font-size: 10px; color: var(--border); text-align: center; margin: 2px 0 2px 170px; }

  .cpa-table { width: 100%; border-collapse: collapse; }
  .cpa-table th { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 0 0 12px; text-align: left; border-bottom: 1px solid var(--border); }
  .cpa-table td { padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  .cpa-table tr:last-child td { border-bottom: none; }
  .cpa-pill { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }

  .loading-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    gap: 16px;
  }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--surface2); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--muted); }

  .error-card {
    background: rgba(224,82,82,.08);
    border: 1px solid rgba(224,82,82,.25);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 24px;
    display: none;
  }
  .error-card.visible { display: block; }
  .error-title { color: var(--red); font-weight: 600; margin-bottom: 6px; }
  .error-msg { color: var(--muted); font-size: 12px; line-height: 1.6; }

  .updated-at { font-size: 11px; color: var(--muted); text-align: right; margin-bottom: 12px; }

  .no-data { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }

  @media(max-width:600px){
    main { padding: 16px; }
    header { padding: 14px 16px; }
    .funnel-label-col { min-width: 110px; font-size: 11px; }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Conectando ao Meta Ads...</div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.1 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.514c-1.491 0-1.956.93-1.956 1.886v2.268h3.328l-.532 3.49h-2.796V24C19.612 23.1 24 18.1 24 12.073z"/></svg>
    </div>
    <div>
      <div class="logo-text">Meta Ads Dashboard</div>
      <div class="logo-sub">Relatório em tempo real</div>
    </div>
  </div>
  <div class="header-right">
    <div class="date-badge"><span class="status-dot"></span>Últimos 7 dias</div>
    <button class="refresh-btn" onclick="loadData()">↻ Atualizar</button>
  </div>
</header>

<main>
  <div class="error-card" id="errorCard">
    <div class="error-title">Erro ao carregar dados</div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="updated-at" id="updatedAt"></div>

  <div class="campaign-bar" id="campaignBar" style="display:none">
    <div>
      <div class="campaign-name" id="campaignName">—</div>
    </div>
    <div class="campaign-meta" id="campaignMeta"></div>
  </div>

  <div class="section-title">Entrega & Alcance</div>
  <div class="kpi-grid" id="kpiDelivery"></div>

  <div class="section-title">Financeiro</div>
  <div class="kpi-grid" id="kpiFinancial"></div>

  <div class="charts-row">
    <div class="card">
      <div class="card-title">Funil de conversão <span class="card-sub">— taxa entre etapas</span></div>
      <div id="funnelContainer"></div>
    </div>
    <div class="card">
      <div class="card-title">CPA por etapa</div>
      <div style="position:relative;height:220px"><canvas id="chartCPA" role="img" aria-label="Custo por ação em cada etapa do funil"></canvas></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:28px">
    <div class="card-title">Desempenho diário — últimos 7 dias</div>
    <div style="position:relative;height:200px"><canvas id="chartDaily" role="img" aria-label="Compras e investimento por dia nos últimos 7 dias"></canvas></div>
  </div>

  <div class="card">
    <div class="card-title">Resumo por evento</div>
    <table class="cpa-table">
      <thead>
        <tr>
          <th>Evento</th>
          <th style="text-align:right">Volume</th>
          <th style="text-align:right">Custo por evento</th>
          <th style="text-align:right">Taxa de conversão</th>
        </tr>
      </thead>
      <tbody id="eventTable"></tbody>
    </table>
  </div>
</main>

<script>
const CONFIG = {
  token: 'EAARrEksm1ZCIBRIcSlX5jog5yG4isa73sIqtAOjIx9EK5DaduZBC1ECNiYOEapt0TdFwatts78fD9AkDgtGERMCDcD4JZCMguUAcd6SH6IZBLcDBGskDJlAuE3vAlztTnwTqMyiy48zPT1Gc5UOYh9BkZCrLZAAuLPZA6EeoZCr3kgJOZBrCcBLA7hb7RA0ed6AZDZD',
  accountId: 'act_136548282398924',
  pixelId: '792129432707941',
  apiVersion: 'v19.0'
};

const API = `https://graph.facebook.com/${CONFIG.apiVersion}`;
let chartCPA = null, chartDaily = null;

function fmt(n, type='number') {
  if (n === null || n === undefined || isNaN(n)) return '—';
  if (type === 'currency') return 'R$ ' + parseFloat(n).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (type === 'pct') return parseFloat(n).toFixed(1) + '%';
  if (type === 'x') return parseFloat(n).toFixed(2) + '×';
  return parseFloat(n).toLocaleString('pt-BR');
}

function getAction(actions, type) {
  if (!actions) return 0;
  const a = actions.find(x => x.action_type === type);
  return a ? parseFloat(a.value) : 0;
}
function getActionVal(action_values, type) {
  if (!action_values) return 0;
  const a = action_values.find(x => x.action_type === type);
  return a ? parseFloat(a.value) : 0;
}

async function apiFetch(path) {
  const res = await fetch(`${API}/${path}`);
  const json = await res.json();
  if (json.error) throw new Error(json.error.message);
  return json;
}

function showError(msg) {
  document.getElementById('errorCard').classList.add('visible');
  document.getElementById('errorMsg').textContent = msg;
}

function renderKPI(containerId, cards) {
  const el = document.getElementById(containerId);
  el.innerHTML = cards.map(c => `
    <div class="kpi-card ${c.color}">
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value">${c.value}</div>
      ${c.sub ? `<div class="kpi-sub">${c.sub}</div>` : ''}
    </div>
  `).join('');
}

function renderFunnel(stages) {
  const maxVal = stages[0].val;
  const el = document.getElementById('funnelContainer');
  const colors = ['#4a90e2','#1fc08a','#9b7fe8','#f5a623','#e05252'];
  el.innerHTML = stages.map((s, i) => {
    const pct = maxVal > 0 ? (s.val / maxVal * 100) : 0;
    const cvr = i === 0 ? '' : (stages[i-1].val > 0 ? ((s.val / stages[i-1].val)*100).toFixed(1)+'%' : '—');
    const arrow = i > 0 ? `<div class="funnel-arrow">↓ ${cvr} convertem</div>` : '';
    return `${arrow}<div class="funnel-stage">
      <div class="funnel-label-col">${s.label}</div>
      <div class="funnel-bar-col">
        <div class="funnel-fill" style="width:${pct.toFixed(1)}%;background:${colors[i]}">${pct.toFixed(0)}%</div>
      </div>
      <div class="funnel-values">
        <div class="funnel-num">${fmt(s.val)}</div>
        ${cvr ? `<div class="funnel-cvr">conv.: ${cvr}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderCPAChart(stages, spend) {
  const data = stages.slice(1).map(s => s.val > 0 ? spend / s.val : 0);
  const labels = stages.slice(1).map(s => s.label);
  const colors = ['#1fc08a','#9b7fe8','#f5a623','#e05252'];
  if (chartCPA) chartCPA.destroy();
  chartCPA = new Chart(document.getElementById('chartCPA'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: colors,
        borderRadius: 6,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: {
          ticks: { color: '#8b8fa8', font: { size: 11 }, callback: v => 'R$' + v.toFixed(0) },
          grid: { color: 'rgba(255,255,255,.05)' },
          border: { display: false }
        },
        y: {
          ticks: { color: '#8b8fa8', font: { size: 11 } },
          grid: { display: false },
          border: { display: false }
        }
      }
    }
  });
}

function renderDailyChart(daily) {
  const labels = daily.map(d => {
    const dt = new Date(d.date_start);
    return dt.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
  });
  const purchases = daily.map(d => getAction(d.actions, 'purchase'));
  const spend = daily.map(d => parseFloat(d.spend || 0));
  if (chartDaily) chartDaily.destroy();
  chartDaily = new Chart(document.getElementById('chartDaily'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Compras',
          data: purchases,
          backgroundColor: '#4a90e2',
          borderRadius: 4,
          yAxisID: 'y'
        },
        {
          label: 'Investimento (R$)',
          data: spend,
          type: 'line',
          borderColor: '#f5a623',
          backgroundColor: 'transparent',
          tension: 0.35,
          pointRadius: 4,
          pointBackgroundColor: '#f5a623',
          yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: true,
          labels: { color: '#8b8fa8', font: { size: 11 }, boxWidth: 10, boxHeight: 2, padding: 16 }
        }
      },
      scales: {
        x: { ticks: { color: '#8b8fa8', font: { size: 11 }, autoSkip: false }, grid: { color: 'rgba(255,255,255,.05)' }, border: { display: false } },
        y: { ticks: { color: '#8b8fa8', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,.05)' }, border: { display: false }, title: { display: true, text: 'Compras', color: '#8b8fa8', font: { size: 10 } } },
        y1: { position: 'right', ticks: { color: '#f5a623', font: { size: 11 }, callback: v => 'R$'+v.toFixed(0) }, grid: { display: false }, border: { display: false } }
      }
    }
  });
}

function renderEventTable(stages, spend) {
  const colors = ['#4a90e2','#1fc08a','#9b7fe8','#f5a623','#e05252'];
  const maxVal = stages[0].val;
  const tbody = document.getElementById('eventTable');
  tbody.innerHTML = stages.map((s, i) => {
    const cpa = s.val > 0 ? spend / s.val : null;
    const cvr = maxVal > 0 ? (s.val / maxVal * 100) : 0;
    return `<tr>
      <td><span class="cpa-pill" style="background:${colors[i]}22;color:${colors[i]}">${s.label}</span></td>
      <td style="text-align:right;font-weight:600">${fmt(s.val)}</td>
      <td style="text-align:right">${cpa ? fmt(cpa,'currency') : '—'}</td>
      <td style="text-align:right">${fmt(cvr,'pct')}</td>
    </tr>`;
  }).join('');
}

async function loadData() {
  document.getElementById('loadingOverlay').style.display = 'flex';
  document.getElementById('errorCard').classList.remove('visible');

  try {
    const insightFields = [
      'campaign_name','impressions','reach','clicks','frequency',
      'cpm','spend','actions','action_values','date_start','date_stop'
    ].join(',');

    const [summary, daily, campaigns] = await Promise.all([
      apiFetch(`${CONFIG.accountId}/insights?fields=${insightFields}&date_preset=last_7_days&level=account&access_token=${CONFIG.token}`),
      apiFetch(`${CONFIG.accountId}/insights?fields=${insightFields}&date_preset=last_7_days&time_increment=1&level=account&access_token=${CONFIG.token}`),
      apiFetch(`${CONFIG.accountId}/campaigns?fields=id,name,status,objective&limit=5&access_token=${CONFIG.token}`)
    ]);

    const d = summary.data && summary.data[0];
    if (!d) throw new Error('Sem dados no período. Verifique se a conta tem campanhas ativas nos últimos 7 dias.');

    const impressions = parseFloat(d.impressions || 0);
    const reach = parseFloat(d.reach || 0);
    const clicks = parseFloat(d.clicks || 0);
    const freq = parseFloat(d.frequency || 0);
    const cpm = parseFloat(d.cpm || 0);
    const spend = parseFloat(d.spend || 0);
    const ctr = impressions > 0 ? (clicks / impressions * 100) : 0;

    const addToCart = getAction(d.actions, 'add_to_cart') || getAction(d.actions, 'offsite_conversion.fb_pixel_add_to_cart');
    const initCheckout = getAction(d.actions, 'initiate_checkout') || getAction(d.actions, 'offsite_conversion.fb_pixel_initiate_checkout');
    const purchases = getAction(d.actions, 'purchase') || getAction(d.actions, 'offsite_conversion.fb_pixel_purchase');
    const revenue = getActionVal(d.action_values, 'purchase') || getActionVal(d.action_values, 'offsite_conversion.fb_pixel_purchase');
    const roas = spend > 0 && revenue > 0 ? revenue / spend : null;
    const ticket = purchases > 0 && revenue > 0 ? revenue / purchases : null;

    renderKPI('kpiDelivery', [
      { label: 'Impressões', value: fmt(impressions), sub: `Alcance: ${fmt(reach)}`, color: 'blue' },
      { label: 'CPM', value: fmt(cpm,'currency'), sub: 'Custo por mil impressões', color: 'orange' },
      { label: 'Frequência', value: freq.toFixed(2)+'×', sub: freq > 3 ? '⚠ Acima do ideal' : '✓ Dentro do ideal', color: freq > 3 ? 'red' : 'teal' },
      { label: 'Cliques', value: fmt(clicks), sub: `CTR ${fmt(ctr,'pct')}`, color: 'purple' },
    ]);

    renderKPI('kpiFinancial', [
      { label: 'Investimento', value: fmt(spend,'currency'), sub: 'Últimos 7 dias', color: 'orange' },
      { label: 'Receita', value: revenue > 0 ? fmt(revenue,'currency') : '—', sub: 'Via Pixel', color: 'green' },
      { label: 'ROAS', value: roas ? fmt(roas,'x') : '—', sub: roas && roas >= 2 ? '✓ Saudável' : roas ? '⚠ Abaixo de 2×' : 'Configure o Pixel', color: roas && roas >= 2 ? 'teal' : 'orange' },
      { label: 'Ticket médio', value: ticket ? fmt(ticket,'currency') : '—', sub: 'Por compra', color: 'purple' },
    ]);

    const stages = [
      { label: 'Impressões', val: impressions },
      { label: 'Cliques', val: clicks },
      { label: 'Adição ao carrinho', val: addToCart },
      { label: 'Início de checkout', val: initCheckout },
      { label: 'Compras', val: purchases },
    ];

    renderFunnel(stages);
    renderCPAChart(stages, spend);
    renderEventTable(stages, spend);

    if (daily.data && daily.data.length > 0) {
      renderDailyChart(daily.data);
    }

    if (campaigns.data && campaigns.data.length > 0) {
      const active = campaigns.data.filter(c => c.status === 'ACTIVE');
      document.getElementById('campaignBar').style.display = 'flex';
      document.getElementById('campaignName').textContent = active.length > 0 ? active[0].name : campaigns.data[0].name;
      document.getElementById('campaignMeta').innerHTML = [
        `<div class="campaign-tag">Status: <span>${active.length > 0 ? 'Ativa' : campaigns.data[0].status}</span></div>`,
        `<div class="campaign-tag">Conta: <span>${CONFIG.accountId.replace('act_','')}</span></div>`,
        `<div class="campaign-tag">Pixel: <span>${CONFIG.pixelId}</span></div>`,
      ].join('');
    }

    document.getElementById('updatedAt').textContent = 'Atualizado em ' + new Date().toLocaleString('pt-BR');
  } catch (err) {
    showError(err.message || 'Erro desconhecido. Verifique se o Access Token é válido e tem permissão ads_read.');
  } finally {
    document.getElementById('loadingOverlay').style.display = 'none';
  }
}

loadData();
</script>
</body>
</html>
